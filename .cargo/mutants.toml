# Mutants that the checks mutation testing runs can't notice.
exclude_re = [
    # These compute the same thing. `|` joins bits that don't overlap here, so
    # `^` gives the same value.
    'replace \| with \^ in (Mapping::anonymous|Mapping::map|parts|enter_protected_mode|set_low|set_high|State::next_packet|Network::address_decisions)$',
    'initramfs\.rs:\d+:\d+: replace \| with \^$',
    'crates/guest/src/lib\.rs:\d+:\d+: replace \| with \^$',
    # Linux ignores the descriptor of an anonymous mapping.
    'delete - in Mapping::anonymous$',
    # Only a real VM runs these, so only `t1` can notice them, and mutation
    # testing doesn't run `t1`. Its `ap_boot_command` tests fail without the
    # init or the interrupt, and its `share` tests without the deadline. The
    # share relay's deadline is the only `+` in `boot_linked`.
    'crates/ap/src/boot\.rs:\d+:\d+: replace init -> io::Result<\(\)> with Ok\(\(\)\)$',
    'crates/ap/src/boot\.rs:\d+:\d+: replace <impl Line for Interrupt<.?_>>::pulse with \(\)$',
    'crates/ap/src/boot\.rs:\d+:\d+: replace \+ with - in boot_linked$',
]
