# Readies a GitHub-hosted runner for our tests. The refresh and the runner gate
# both use it, so a fix for the runner lands in both. A job checks out the
# repository before it uses this, and it runs this from that checkout.
name: runner-setup
description: Opens KVM, lets the runner's user map ids, and starts a systemd user session

runs:
  using: composite
  steps:
    - name: Open KVM to the runner's user
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    # Ubuntu's AppArmor lets a plain process make a user namespace, but not
    # write its id maps. The share owner test runs its server as another uid
    # in one, so the runner's user must be able to map ids there.
    - name: Let the runner's user map ids in a user namespace
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Start a systemd user session
      shell: bash
      run: |
        sudo loginctl enable-linger "$USER"
        sudo systemctl start "user@$(id -u).service"
        echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
