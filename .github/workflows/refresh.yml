# Proves each land-needed PR that the owner approved by arming auto-merge, and
# merges it, when one is armed and whenever `main` moves. `cargo xtask refresh`
# holds the logic.
#
# This job runs a PR's tests with a token that can write. `prepare` refuses PRs
# from forks, so only code from people with write access runs here.
# `pull_request_target` runs this file from the default branch, and the job
# checks out `main`, so a PR can't change what proves it.
name: refresh

on:
  push:
    branches: [main]
  pull_request_target:
    types: [auto_merge_enabled]
  # A worker parks a fixed PR this way, and its auto-merge is still armed.
  issues:
    types: [labeled]

permissions: {}

jobs:
  refresh:
    if: github.event_name != 'issues' || github.event.label.name == 'land-needed'
    runs-on: ubuntu-latest
    # A newer run replaces one that is still queued. That loses nothing, because
    # each run proves against the newest `main`. The group is on the job, so
    # that a run this job skips never joins it. On the workflow, a label that
    # starts no refresh would replace a queued run that does.
    concurrency:
      group: refresh
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Open KVM to the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Ubuntu's AppArmor lets a plain process make a user namespace, but not
      # write its id maps. The share owner test runs its server as another
      # uid in one, so the runner's user must be able to map ids there.
      - name: Let the runner's user map ids in a user namespace
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: cargo xtask refresh
