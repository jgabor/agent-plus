[workspace]
members = ["xtask", "crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[profile.release]
strip = true

[profile.dev]
debug = false

# Building and running an agent compresses, decompresses, and hashes images of
# hundreds of megabytes. Unoptimized, these crates take much of the CPU time of
# the tests that do it with a debug build.
[profile.dev.package.structured-zstd]
opt-level = 3

[profile.dev.package.ruzstd]
opt-level = 3

[profile.dev.package.graviola]
opt-level = 3
