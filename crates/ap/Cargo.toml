[package]
name = "ap"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
graviola = "0.4"
libc = "0.2"
agentfile = { path = "../agentfile" }
erofs = { path = "../erofs" }
git = { path = "../git" }
guest = { path = "../guest" }
net = { path = "../net" }
netstack = { path = "../netstack" }
share = { path = "../share" }
store = { path = "../store" }
ruzstd = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-graviola = "0.4"
vmm = { path = "../vmm" }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
time = { version = "0.3", default-features = false }

[dev-dependencies]
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }

[lints]
workspace = true
