[package]
name = "net"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
agentfile = { path = "../agentfile" }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
httparse = { version = "1", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
h2 = { version = "0.4.20", default-features = false }
http = { version = "1", default-features = false }
rustls-graviola = "0.4"
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "sync"] }

[lints]
workspace = true
